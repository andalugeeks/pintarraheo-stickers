# Builds the iOS sticker app on a GitHub-hosted macOS runner, signs it with Xcode
# cloud-managed signing (App Store Connect API key) and uploads it to TestFlight.
# Setup and required secrets: iOS/TESTFLIGHT.md
# Pushes that only touch other paths do not trigger it; edit this file or iOS/ to rebuild.
name: iOS TestFlight

on:
  workflow_dispatch:
  push:
    branches: [main, ios-testflight]
    paths:
      - 'iOS/**'
      - '.github/workflows/ios-testflight.yml'

permissions:
  contents: read

concurrency:
  group: ios-testflight
  cancel-in-progress: false

jobs:
  testflight:
    # Secrets are only available in this repository, never in forks.
    if: github.repository == 'andalugeeks/pintarraheo-stickers'
    runs-on: macos-26
    timeout-minutes: 45
    env:
      XCODE_APP: /Applications/Xcode_26.6.app
      TEAM_ID: LAWPFLVDHJ
      IOS_DIR: iOS
      SCHEME: WAStickersThirdParty
      # TestFlight rejects repeated build numbers; re-runs bump the last component.
      BUILD_NUMBER: ${{ github.run_number }}.${{ github.run_attempt }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
    steps:
      - uses: actions/checkout@v5

      - name: Select Xcode
        run: |
          sudo xcode-select -s "$XCODE_APP"
          xcodebuild -version

      - name: Install App Store Connect API key
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          # altool looks the key up in this directory by its Key ID.
          mkdir -p ~/.appstoreconnect/private_keys
          printf '%s\n' "$ASC_KEY_P8" > ~/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8
          chmod 600 ~/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8
          echo "ASC_KEY_PATH=$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8" >> "$GITHUB_ENV"

      # The archive is left unsigned: signing it would make Xcode create a new development
      # certificate on every fresh runner, and the team has hit Apple's certificate limit.
      # The export step signs with the existing cloud-managed distribution certificate.
      - name: Archive
        working-directory: ${{ env.IOS_DIR }}
        run: |
          mkdir -p "$RUNNER_TEMP/logs"
          xcodebuild archive \
            -project WAStickersThirdParty.xcodeproj \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            > "$RUNNER_TEMP/logs/archive.log" 2>&1 \
            || { grep -E "error:|warning: .*deprecated" "$RUNNER_TEMP/logs/archive.log" | head -50; tail -n 200 "$RUNNER_TEMP/logs/archive.log"; exit 1; }
          tail -n 5 "$RUNNER_TEMP/logs/archive.log"

      # WebP.framework is an old static library with embedded bitcode; App Store Connect
      # rejects binaries that still carry it, so fail early if the linker kept any.
      - name: Check for bitcode
        run: |
          BIN="$RUNNER_TEMP/App.xcarchive/Products/Applications/$SCHEME.app/$SCHEME"
          lipo -info "$BIN"
          if otool -l "$BIN" | grep -q __LLVM; then
            echo "Binary contains bitcode"; exit 1
          fi

      - name: Export IPA
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>export</string>
            <key>signingStyle</key><string>automatic</string>
            <key>teamID</key><string>${TEAM_ID}</string>
            <key>uploadSymbols</key><true/>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict>
          </plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            > "$RUNNER_TEMP/logs/export.log" 2>&1 \
            || { tail -n 200 "$RUNNER_TEMP/logs/export.log"; exit 1; }
          ls -l "$RUNNER_TEMP/export"

      - name: Upload to TestFlight
        run: |
          xcrun altool --upload-app \
            --type ios \
            --file "$RUNNER_TEMP/export/$SCHEME.ipa" \
            --apiKey "$ASC_KEY_ID" \
            --apiIssuer "$ASC_ISSUER_ID"

      - name: Remove API key
        if: always()
        run: rm -rf ~/.appstoreconnect

      - name: Keep logs
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: ios-logs-${{ env.BUILD_NUMBER }}
          path: ${{ runner.temp }}/logs/
          if-no-files-found: ignore
          retention-days: 14
